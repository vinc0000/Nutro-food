name: Supabase Keep Alive

on:
  schedule:
    - cron: "3,8,13,18,23,28,33,38,43,48,53,58 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Keep Supabase awake
        run: |
          SUPABASE_URL="https://wqxjsbikoriuzinordko.supabase.co"
          SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndxeGpzYmlrb3JpdXppbm9yZGtvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU2NjE5NjIsImV4cCI6MjEwMTIzNzk2Mn0.-_vYWf0y9Mnbqjx56MCvTsSp4YjbeMKvruGRyxAEaos"

          echo "Ping de Supabase..."

          HTTP_STATUS=$(curl \
            --silent \
            --output /dev/null \
            --write-out "%{http_code}" \
            --request GET \
            --url "${SUPABASE_URL}/rest/v1/" \
            --header "apikey: ${SUPABASE_ANON_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_ANON_KEY}")

          echo "HTTP Status: ${HTTP_STATUS}"

          if [ "${HTTP_STATUS}" -ge 200 ] && [ "${HTTP_STATUS}" -lt 500 ]; then
            echo "✅ Supabase répond correctement."
          else
            echo "❌ Supabase ne répond pas correctement."
            exit 1
          fi
